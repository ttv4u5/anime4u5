    <meta

      content="Kad Mencatat Waktu, Log Perjalanan Kerajaan & Pengurusan Fail Rasmi — Government Record System"
    />
    <meta name="author" content="Sistem Rekod Kerajaan" />
    <link rel="icon" type="image/png" href="/icon/icon-192.png" />

    <!-- PWA Configuration -->
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Sistem Rekod" />
    <link rel="apple-touch-icon" href="/icon/icon-192.png" />

    <meta property="og:title" content="FleetData" />
    <meta
      property="og:description"
      content="Kad Mencatat Waktu, Log Perjalanan Kerajaan & Pengurusan Fail Rasmi"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://hercules.app/og/app/%VITE_HERCULES_WEBSITE_ID%.png"
    />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://hercules.app/og/app/%VITE_HERCULES_WEBSITE_ID%.png"
    />
    <meta name="twitter:site" content="@usehercules" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Geist+Mono:wght@100..900&family=Geist:wght@100..900&family=Orbitron:wght@400;700;900&family=Bangers&family=Noto+Serif:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
      crossorigin
    />

    <!-- Detect dark mode preference and set the class before next-themes loads. This avoids a flash of unstyled content (FOUC) when the page loads. -->
    <script>
      try {
        let theme = localStorage.getItem('theme');
        if (theme === 'system' || !theme) {
          let prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          theme = prefersDark ? 'dark' : 'light';
        }
        document.documentElement.classList.add(theme);
      } catch (e) {}
    </script>

    <link href="/src/index.css" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
